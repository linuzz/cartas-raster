name: Publicar ou rejeitar carta

on:
  pull_request:
    types: [closed]
    paths:
      - "proposals/**"

permissions:
  contents: write
  pull-requests: read
  pages: write

concurrency:
  group: cartas-raster-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: "1"
    permissions:
      contents: write
      pages: write
    outputs:
      pages: ${{ steps.flag.outputs.pages }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Instalar
        run: python -m pip install -e .

      - name: Publicar as cartas mescladas
        id: flag
        env:
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout main
          if [ -n "$MERGE_SHA" ]; then
            mapfile -t files < <(git diff --name-only --diff-filter=A "${MERGE_SHA}^" "$MERGE_SHA" -- proposals || true)
          else
            mapfile -t files < <(git diff --name-only --diff-filter=A HEAD^ HEAD -- proposals || true)
          fi
          if [ "${#files[@]}" -eq 0 ]; then
            echo "Nenhum arquivo em proposals/ neste merge."
            echo "pages=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          for proposal in "${files[@]}"; do
            python -m cartas_raster.cli publish-merged --proposal "$proposal"
          done
          echo "pages=true" >> "$GITHUB_OUTPUT"

      - name: Enviar catálogo para o GitHub Pages
        if: steps.flag.outputs.pages == 'true'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: docs

  reject:
    if: github.event.pull_request.merged == false
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Instalar
        run: python -m pip install -e .

      - name: Registrar a rejeição
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          labels="$(gh pr view "$PR_NUMBER" --json labels --jq '.labels[].name')"
          if printf '%s\n' "$labels" | grep -qx 'superseded'; then
            echo "PR substituído por uma edição mais nova. Esta edição não foi rejeitada."
            exit 0
          fi
          git fetch origin "$HEAD_SHA"
          mapfile -t files < <(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" --jq '.[].filename')
          found=0
          for path in "${files[@]}"; do
            case "$path" in
              proposals/*.json)
                git show "${HEAD_SHA}:${path}" > /tmp/proposal.json
                python -m cartas_raster.cli reject-closed --proposal /tmp/proposal.json
                found=1
                ;;
            esac
          done
          if [ "$found" -eq 0 ]; then
            echo "PR sem proposals/*.json."
            exit 1
          fi

  deploy:
    needs: publish
    if: always() && needs.publish.outputs.pages == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar o catálogo
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
