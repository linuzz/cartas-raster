name: Testes

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar e testar
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest
          python -m cartas_raster.cli check-catalog docs/BR_RNCProdCat.xml
