name: Atualizar cartas raster

on:
  schedule:
    # Segunda-feira, 06:00 UTC. Uma vez por semana.
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      update_mode:
        description: "Modo (vazio usa a variável UPDATE_MODE do repositório)"
        type: choice
        options:
          - ""
          - auto
          - review
        default: ""
      dry_run:
        description: "Só mostrar as mudanças, sem publicar e sem abrir PR"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  pages: write

concurrency:
  group: cartas-raster-publish
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    # gh refuses to run in Actions unless GH_TOKEN is set. GITHUB_TOKEN alone is not enough.
    # git push uses the credential stored by actions/checkout (persist-credentials), not gh.
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: "1"
    permissions:
      contents: write
      pull-requests: write
      pages: write
    outputs:
      pages: ${{ steps.outcome.outputs.pages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Instalar
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          python -m pip install -e .

      - name: Definir o modo
        id: mode
        env:
          UPDATE_MODE_INPUT: ${{ inputs.update_mode }}
          UPDATE_MODE_VAR: ${{ vars.UPDATE_MODE }}
          MAX_REVIEW_PRS_VAR: ${{ vars.MAX_REVIEW_PRS }}
        run: |
          set -eu
          MODE="$UPDATE_MODE_INPUT"
          if [ -z "$MODE" ]; then
            MODE="$UPDATE_MODE_VAR"
          fi
          if [ -z "$MODE" ]; then
            MODE="review"
          fi
          case "$MODE" in
            auto|review) ;;
            *)
              echo "UPDATE_MODE inválido: $MODE. Use auto ou review." >&2
              exit 1
              ;;
          esac
          MAX="$MAX_REVIEW_PRS_VAR"
          if [ -z "$MAX" ]; then
            MAX="30"
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "max=$MAX" >> "$GITHUB_OUTPUT"
          echo "Modo: $MODE. Máximo de PRs nesta execução: $MAX."

      - name: Atualizar
        id: outcome
        env:
          MAX_REVIEW_PRS: ${{ steps.mode.outputs.max }}
          MIN_RESOLVED_RATIO: ${{ vars.MIN_RESOLVED_RATIO }}
          RUN_MODE: ${{ steps.mode.outputs.mode }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ARGS=(run --mode "$RUN_MODE")
          if [ "$DRY_RUN" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          set +e
          python -m cartas_raster.cli "${ARGS[@]}"
          code=$?
          set -e
          if [ "$RUN_MODE" = "auto" ] && [ "$DRY_RUN" != "true" ]; then
            echo "pages=true" >> "$GITHUB_OUTPUT"
          else
            echo "pages=false" >> "$GITHUB_OUTPUT"
          fi
          exit "$code"

      - name: Enviar catálogo para o GitHub Pages
        if: always() && steps.outcome.outputs.pages == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs

  deploy:
    needs: update
    if: always() && needs.update.outputs.pages == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar o catálogo
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
