name: Atualizar cartas raster

on:
  schedule:
    # Segunda-feira, 06:00 UTC. Uma vez por semana.
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      update_mode:
        description: "Modo (vazio usa a variável UPDATE_MODE do repositório)"
        type: choice
        options:
          - ""
          - auto
          - review
        default: ""
      dry_run:
        description: "Só mostrar as mudanças, sem publicar e sem abrir PR"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  pages: write
  id-token: write

concurrency:
  group: cartas-raster-publish
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    # gh refuses to run in Actions unless GH_TOKEN is set. GITHUB_TOKEN alone is not enough.
    # git push uses the credential stored by actions/checkout (persist-credentials), not gh.
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: "1"
    permissions:
      contents: write
      pull-requests: write
      pages: write
      id-token: write
    outputs:
      pages: ${{ steps.outcome.outputs.pages }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar
        run: python -m pip install -e .

      - name: Definir o modo
        id: mode
        run: |
          set -eu
          MODE="${{ inputs.update_mode }}"
          if [ -z "$MODE" ]; then
            MODE="${{ vars.UPDATE_MODE }}"
          fi
          if [ -z "$MODE" ]; then
            MODE="review"
          fi
          case "$MODE" in
            auto|review) ;;
            *)
              echo "UPDATE_MODE inválido: $MODE. Use auto ou review." >&2
              exit 1
              ;;
          esac
          MAX="${{ vars.MAX_REVIEW_PRS }}"
          if [ -z "$MAX" ]; then
            MAX="30"
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "max=$MAX" >> "$GITHUB_OUTPUT"
          echo "Modo: $MODE. Máximo de PRs nesta execução: $MAX."

      - name: Atualizar
        id: outcome
        env:
          MAX_REVIEW_PRS: ${{ steps.mode.outputs.max }}
          MIN_RESOLVED_RATIO: ${{ vars.MIN_RESOLVED_RATIO }}
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ARGS=(run --mode "${{ steps.mode.outputs.mode }}")
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          set +e
          python -m cartas_raster.cli "${ARGS[@]}"
          code=$?
          set -e
          if [ "${{ steps.mode.outputs.mode }}" = "auto" ] && [ "${{ inputs.dry_run }}" != "true" ]; then
            echo "pages=true" >> "$GITHUB_OUTPUT"
          else
            echo "pages=false" >> "$GITHUB_OUTPUT"
          fi
          exit "$code"

      - name: Enviar catálogo para o GitHub Pages
        if: always() && steps.outcome.outputs.pages == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: update
    if: always() && needs.update.outputs.pages == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar o catálogo
        id: deployment
        uses: actions/deploy-pages@v4
