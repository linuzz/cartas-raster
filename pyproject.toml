[project]
name = "cartas-raster"
version = "1.0.0"
description = "Pipeline that publishes DHN raster nautical charts for OpenCPN Chart Downloader."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest==8.4.2"]

[project.scripts]
cartas-raster = "cartas_raster.cli:main"

[build-system]
requires = ["setuptools==75.8.2"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cartas_raster = ["certs/*.pem"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
